name: Terraform DESTROY

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY to confirm infrastructure deletion'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::640168414211:role/terraform-github-actions
          aws-region: us-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: environments/dev

      - name: Confirm destroy
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "Destroy confirmation failed."
            echo "You must type DESTROY exactly."
            exit 1
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="dev.tfvars"
        working-directory: environments/dev